<svg viewBox="0 0 960 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="850" fill="#ffffff"/>

  <!-- ===================== USUARIO ===================== -->
  <rect x="370" y="18" width="240" height="58" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">🖐️ Usuario</text>
  <text x="490" y="62" text-anchor="middle" font-size="12.5" fill="#475569">hace un gesto con la mano</text>

  <path d="M490,76 L490,120" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== CAMARA ===================== -->
  <rect x="370" y="122" width="240" height="58" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">📷 Cámara web</text>
  <text x="490" y="166" text-anchor="middle" font-size="12.5" fill="#475569">captura frames (cv2.VideoCapture)</text>

  <path d="M490,180 L490,230" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== PC: gesture_control.py ===================== -->
  <rect x="40" y="232" width="880" height="272" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="258" font-size="14" font-weight="700" fill="#1e3a8a" font-family="Consolas, monospace">gesture_control.py</text>
  <text x="220" y="258" font-size="12.5" fill="#1e40af">· PC (Python) — todo el "cerebro" de visión vive aquí</text>

  <!-- OpenCV -->
  <rect x="60" y="272" width="250" height="118" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="185" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1️⃣ OpenCV (cv2)</text>
  <text x="185" y="324" text-anchor="middle" font-size="12.5" fill="#1e40af">lee el frame de la cámara</text>
  <text x="185" y="344" text-anchor="middle" font-size="12.5" fill="#1e40af">flip (efecto espejo)</text>
  <text x="185" y="364" text-anchor="middle" font-size="12.5" fill="#1e40af">convierte BGR → RGB</text>

  <path d="M310,331 L353,331" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- MediaPipe -->
  <rect x="355" y="272" width="250" height="118" rx="14" fill="#1e3a8a" stroke="#1e293b" stroke-width="1.6"/>
  <text x="480" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2️⃣ MediaPipe</text>
  <text x="480" y="324" text-anchor="middle" font-size="12.5" fill="#dbeafe">Gesture Recognizer</text>
  <text x="480" y="344" text-anchor="middle" font-size="12.5" fill="#dbeafe">detecta la mano y clasifica</text>
  <text x="480" y="364" text-anchor="middle" font-size="12.5" fill="#bfdbfe">gesto + confianza (0 a 1)</text>

  <path d="M605,331 L648,331" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Logica -->
  <rect x="650" y="272" width="250" height="118" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="775" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">3️⃣ Lógica de control</text>
  <text x="775" y="324" text-anchor="middle" font-size="12.5" fill="#1e40af">gesto → comando (diccionario)</text>
  <text x="775" y="344" text-anchor="middle" font-size="12.5" fill="#1e40af">debounce de 1 s</text>
  <text x="775" y="364" text-anchor="middle" font-size="12.5" fill="#1e40af">auto-apagado a los 3 s</text>

  <!-- Modelo -> MediaPipe -->
  <path d="M480,436 L480,392" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="345" y="438" width="270" height="52" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="480" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95" font-family="Consolas, monospace">gesture_recognizer.task</text>
  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b21b6">modelo preentrenado de Google (local)</text>

  <!-- Contenedor -> Serial -->
  <path d="M775,504 L775,548 L640,548" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-linejoin="round"/>

  <!-- ===================== SERIAL ===================== -->
  <rect x="330" y="524" width="310" height="60" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="485" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">🔌 Puerto serie (USB · 115200)</text>
  <text x="485" y="568" text-anchor="middle" font-size="12.5" fill="#9a3412" font-family="Consolas, monospace">"I30\n" · "I70\n" · "I100\n" · "M1\n" · "M2\n" · "I0\n"</text>

  <path d="M485,584 L485,640" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== ESP32 ===================== -->
  <rect x="245" y="642" width="480" height="90" rx="16" fill="#1e3a8a" stroke="#1e293b" stroke-width="1.6"/>
  <text x="485" y="674" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">esp32_firmware.ino</text>
  <text x="485" y="695" text-anchor="middle" font-size="12.5" fill="#dbeafe">ESP32: lee el Serial → procesarComando() → ledcWrite()</text>
  <text x="485" y="715" text-anchor="middle" font-size="11.5" fill="#bfdbfe">no reconoce gestos: solo obedece comandos y genera el PWM</text>

  <path d="M485,732 L485,776" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="760" font-size="11.5" fill="#475569">PWM 5 kHz · 8 bits · GPIO 2</text>

  <!-- ===================== LED ===================== -->
  <rect x="330" y="778" width="310" height="58" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="485" y="802" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">💡 LED + resistencia (220–330 Ω)</text>
  <text x="485" y="822" text-anchor="middle" font-size="12.5" fill="#166534">30 / 70 / 100 % · parpadeo · respiración · apagado</text>

</svg>
